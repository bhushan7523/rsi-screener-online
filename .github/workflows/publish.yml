name: Publish RSI dashboard

on:
  schedule:
    - cron: "47 6 * * 1-5"    # 12:17 PM IST, Mon–Fri (midday, provisional)
    - cron: "17 11 * * 1-5"   # 4:47 PM IST, Mon–Fri (after the NSE close)
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write               # lets the keep-alive step re-enable this schedule

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run the screener (Yahoo Finance)
        run: python -W ignore screener.py --source yahoo --no-open
      - name: Lock the page with the password
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python lock_page.py dashboard.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  keepalive:
    # Re-enables this workflow on every run so GitHub's 60-day inactivity pause never kicks in.
    runs-on: ubuntu-latest
    steps:
      - name: Keep the schedule active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable publish.yml --repo "${{ github.repository }}"
